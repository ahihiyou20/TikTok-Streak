name: TikTok Streak

# WARNING: GitHub-hosted runners use foreign datacenter IPs. Using a TikTok session from
# them got the account flagged and logged out everywhere. The schedule was removed on purpose;
# run the bot on your own PC instead (see "Run locally on Windows" in the README).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Type messages but do not send them"
        type: boolean
        default: false

jobs:
  streak:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run TikTok Streak
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: node index.js --debug ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Upload debug screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug.png
          if-no-files-found: ignore

      - name: Discord Notification
        if: always()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
          username: TikTok Streak
          content: |
            **TikTok Streak**
            Status: `${{ job.status }}`
            Repository: `${{ github.repository }}`
            Trigger: `${{ github.event_name }}`
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
